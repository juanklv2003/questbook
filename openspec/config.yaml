# openspec/config.yaml — SDD source of truth for flashcards-ia
# Generated by sdd-init on 2026-09-15. Mode: openspec.
schema: spec-driven
project: flashcards-ia
persistence: openspec

# No test runner exists in backend/ or frontend/ (verified 2026-09-15),
# so strict TDD is disabled until a runner lands.
strict_tdd: false

context: |
  Backend: Node.js + Express 5 + TypeScript (strict) + pg/PostgreSQL + Gemini AI + Cloudinary + JWT HttpOnly-cookie auth.
  Frontend: React 19 + Vite + TypeScript + Tailwind CSS v4 + axios (withCredentials) + framer-motion + lucide-react.
  Backend arch: Screaming/Hexagonal — modules/{auth,decks,flashcards,evaluations}/{domain,useCases,infra,http}.
  Frontend arch: Atomic Design + Container/Presentational — atoms/molecules/organisms/containers + hooks/ + lib/.
  API base: /api/v1 (auth, decks, evaluations). Single source of truth: docs/project-context.md (keep in sync).
  Envs validated by Zod in backend/src/config/env.ts; keep backend/.env.example and frontend/.env.example in sync.
  Prior feature specs live in .agent/sdd/ (memo-ai, auth-system, deck-management, router); check them before new work.

testing:
  runner: none
  unit: false
  integration: false
  e2e: false
  coverage: false
  linter: "frontend: npm run lint --prefix frontend (eslint .); backend: none"
  typecheck:
    backend: "npm run build --prefix backend (tsc, strict)"
    frontend: "npm run build --prefix frontend (tsc -b && vite build)"
  formatter: none

rules:
  proposal:
    - Include rollback plan for risky changes
    - Check .agent/sdd/ for an existing feature spec before proposing
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Record endpoint/architecture changes in docs/project-context.md per its strict documentation rule
  design:
    - Backend: follow Domain Port -> Infra Adapter -> UseCase -> HTTP Controller wiring
    - Frontend: keep data-fetching in hooks/, consumed by containers/; no fetching in organisms/
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Avoid barrel files across boundaries; use explicit paths
      - Verify touched side with its build command after each change
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build --prefix backend; npm run build --prefix frontend"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
