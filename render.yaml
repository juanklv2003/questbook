# Render Blueprint — API de QuestBook (Express + TypeScript).
#
# Crear en Render → New → Blueprint → elegir este repo. Los valores marcados con
# `sync: false` se cargan a mano en el dashboard (secretos: no van al repo).
#
# OJO con las cookies: con el frontend en Vercel/Netlify (otro dominio), el
# backend debe emitir la cookie con SameSite=None + Secure, o el login no
# persiste sesión. Ver docs/DEPLOYMENT.md.
#
# Node: el runtime se fija con `.node-version` (raíz del repo, 24) y con
# `engines.node` en backend/package.json. No lo bajes sin revisar los engines de
# pdf-parse (>=22.3) y del driver de Neon (WebSocket global, Node >=21).
services:
  - type: web
    name: flashcards-ia-api # define la URL *.onrender.com: si el nombre ya está tomado, cambialo acá y actualizá las URLs en docs/DEPLOYMENT.md
    runtime: node
    rootDir: backend
    plan: free
    # `--include=dev` es OBLIGATORIO: con NODE_ENV=production (abajo) npm omite
    # devDependencies y el build fallaría con "tsc no se reconoce" porque
    # typescript vive en devDependencies. Verificado con npm ls en ambos modos.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # none → frontend y backend en dominios distintos (Vercel/Netlify + Render).
      # Si usás subdominios del mismo dominio (app.x.com + api.x.com), poné lax.
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Opcional: orígenes extra permitidos por CORS (previews de Vercel, etc.).
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: PDF_MAX_TEXT_CHARS
        sync: false
      - key: AI_DECK_TIMEOUT_MS
        sync: false
      # Aviso (plan free ≈ 512 MB de RAM): multer guarda el PDF en memoria, el
      # worker de pdf-parse lo clona y la subida a Cloudinary sale del mismo
      # buffer, así que un PDF muy grande puede agotar la instancia (OOM → 502).
      # Si ves OOM en los logs de Render, bajá este valor (ej. 25) o pasá a un
      # plan pago. El frontend lee el tope real desde GET /api/v1/health.
      - key: MAX_PDF_UPLOAD_MB
        sync: false
      - key: DB_POOL_MAX
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_PDF_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_MAX_PDF_MB
        sync: false
      - key: API_PUBLIC_BASE_URL
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER_MODE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false